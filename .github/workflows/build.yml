name: Build CrankyPanky

on:
  schedule:
    - cron: '0 2 * * *'   # ежедневно 02:00 UTC — ловит протухание по сроку
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:          # на PR — только сборка и гейт, без деплоя

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ИИ-предфильтру нужна база диффа: before (push) / merge-base (PR)

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Install
        run: pip install -r requirements.txt

      - name: Гейт доверия (валидатор метаданных)
        run: python tools/validate_metadata.py content/

      # Только push/PR: у schedule и ручного запуска нет нового диффа —
      # ежедневная повторная рецензия тратила бы кредиты DeepSeek впустую.
      - name: ИИ-предфильтр (необязательный, не блокирует)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          [ -z "$DEEPSEEK_API_KEY" ] && { echo "ключа нет — пропуск"; exit 0; }
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            base=$BEFORE
            # force-push: before недостижим из веток — пробуем добрать по SHA;
            # новая ветка (before = 000…0) — базы нет вовсе.
            git cat-file -e "$base^{commit}" 2>/dev/null ||
              git fetch -q --no-tags --depth=1 origin "$base" 2>/dev/null ||
              { echo "::warning::база диффа $base недоступна — пропуск"; exit 0; }
          fi
          echo "база диффа: $base"
          git diff -z --name-only --diff-filter=d "$base" HEAD -- 'content/**/*.md' |
            while IFS= read -r -d '' f; do
              ./scripts/review.sh "$f" </dev/null ||
                echo "::warning file=$f::ИИ-рецензия не получена"
            done
          # reviews/ в .gitignore, на раннере пуст до этого шага — всё найденное из этого прогона
          for r in reviews/*/*.md; do
            [ -f "$r" ] || continue
            { printf '### %s\n' "$r"; sed '1,/^---$/d' "$r"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Сборка build/ (+ индексы, дашборд свежести)
        run: python tools/inject_frontmatter.py

      - name: MkDocs build
        env:
          NO_MKDOCS_2_WARNING: 'true'   # mkdocs<2 закреплён в requirements.txt
        run: mkdocs build --strict

      # Деплой по умолчанию — GitHub Pages. На Cloudflare Pages (превью на
      # каждый PR, быстрее в РФ/СНГ) меняется этот шаг, репозиторий тот же.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: { path: site }

  # Требует Settings → Pages → Source: GitHub Actions, иначе deploy-pages падает 404.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'   # PR и ручной запуск с других веток — без деплоя
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
