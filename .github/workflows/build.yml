name: Build CrankyPanky

on:
  schedule:
    - cron: '0 2 * * *'   # ежедневно 02:00 UTC — ловит протухание по сроку
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:          # на PR — только сборка и гейт, без деплоя

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Install
        run: pip install -r requirements.txt

      - name: Гейт доверия (валидатор метаданных)
        run: python tools/validate_metadata.py content/

      - name: ИИ-предфильтр (необязательный, не блокирует)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          [ -z "$DEEPSEEK_API_KEY" ] && { echo "ключа нет — пропуск"; exit 0; }
          for f in $(git diff --name-only HEAD~1 -- 'content/**/*.md' 2>/dev/null); do
            [ -f "$f" ] && ./scripts/review.sh "$f" || true
          done

      - name: Сборка build/ (+ индексы, дашборд свежести)
        run: python tools/inject_frontmatter.py

      - name: MkDocs build
        env:
          NO_MKDOCS_2_WARNING: 'true'   # mkdocs<2 закреплён в requirements.txt
        run: mkdocs build --strict

      # Деплой по умолчанию — GitHub Pages. На Cloudflare Pages (превью на
      # каждый PR, быстрее в РФ/СНГ) меняется этот шаг, репозиторий тот же.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: { path: site }

  # Требует Settings → Pages → Source: GitHub Actions, иначе deploy-pages падает 404.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'   # PR и ручной запуск с других веток — без деплоя
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
