name: Deploy CrankyPanky

# Публикация сайта на GitHub Pages. Только main: push, ежедневный запуск
# (протухание по сроку — баннеры свежести считаются при сборке) и ручной запуск.
# Проверки PR — в build.yml, они окружения github-pages не касаются.
# Требует Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # ежедневно 02:00 UTC
  workflow_dispatch:

concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    if: github.ref == 'refs/heads/main'   # ручной запуск с другой ветки — не публикуем
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Install
        run: pip install -r requirements.txt

      # Гейт повторяется и здесь: опубликовать можно только то, что его проходит.
      - name: Гейт доверия (валидатор метаданных)
        run: python tools/validate_metadata.py content/

      - name: Сборка build/ (+ индексы, дашборд свежести)
        run: python tools/inject_frontmatter.py

      - name: MkDocs build
        env:
          NO_MKDOCS_2_WARNING: 'true'   # mkdocs<2 закреплён в requirements.txt
        run: mkdocs build --strict

      # Деплой по умолчанию — GitHub Pages. На Cloudflare Pages (превью на
      # каждый PR, быстрее в РФ/СНГ) меняется этот шаг, репозиторий тот же.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
